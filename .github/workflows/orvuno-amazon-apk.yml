name: ORVUNO Amazon APK

on:
  push:
    branches: [feature/amazon-appstore-release]
    paths:
      - 'android/amazon/**'
      - '.github/workflows/orvuno-amazon-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Inject Amazon Appstore public key when configured
        env:
          AMAZON_KEY_B64: ${{ secrets.AMAZON_APPSTORE_PUBLIC_KEY_B64 }}
        run: |
          mkdir -p android/amazon/app/src/main/assets
          if [ -n "$AMAZON_KEY_B64" ]; then
            printf '%s' "$AMAZON_KEY_B64" | base64 --decode > android/amazon/app/src/main/assets/AppstoreAuthenticationKey.pem
            echo 'Amazon Appstore public key injected.'
          else
            echo 'WARNING: AMAZON_APPSTORE_PUBLIC_KEY_B64 is not configured; APK can be start-tested but Appstore SDK IAP authentication is not release-ready.'
          fi
      - name: Build release APK
        run: gradle -p android/amazon :app:assembleRelease --no-daemon --stacktrace
      - name: Verify package and version
        run: |
          APK=android/amazon/app/build/outputs/apk/release/app-release-unsigned.apk
          test -f "$APK"
          BADGING=$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK")
          printf '%s\n' "$BADGING" | grep "package: name='de.nadena.orvuno' versionCode='2' versionName='1.0.1'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump xmltree "$APK" AndroidManifest.xml | grep -q 'com.amazon.device.iap.ResponseReceiver'
          if unzip -l "$APK" | grep -q 'assets/AppstoreAuthenticationKey.pem'; then echo 'IAP_KEY_PRESENT=yes' | tee amazon-build.txt; else echo 'IAP_KEY_PRESENT=no' | tee amazon-build.txt; fi
          sha256sum "$APK" | tee -a amazon-build.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ORVUNO-Amazon-1.0.1-code2-unsigned
          path: |
            android/amazon/app/build/outputs/apk/release/app-release-unsigned.apk
            amazon-build.txt
          if-no-files-found: error
          retention-days: 14
