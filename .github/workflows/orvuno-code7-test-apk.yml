name: ORVUNO Code7 Test APK

on:
  push:
    branches:
      - build/orvuno-code7-test-apk
    paths:
      - 'android-test/**'
      - 'android-release/**'
      - '.github/workflows/orvuno-code7-test-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 build tools
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Generate test project from original ORVUNO wrapper structure
        run: bash android-test/build-orvuno-code7-test.sh android-test/orvuno-code7-test

      - name: Validate minimal native changes
        run: |
          set -euo pipefail
          GRADLE=android-test/orvuno-code7-test/app/build.gradle
          MANIFEST=android-test/orvuno-code7-test/app/src/main/AndroidManifest.xml
          DELEGATION=android-test/orvuno-code7-test/app/src/main/java/de/nadena/orvuno/DelegationService.java
          grep -q "applicationId 'de.nadena.orvuno.test'" "$GRADLE"
          grep -q 'minSdk 23' "$GRADLE"
          grep -q 'targetSdk 36' "$GRADLE"
          grep -q 'versionCode 7' "$GRADLE"
          grep -q "versionName '1.0.4-test'" "$GRADLE"
          grep -q 'com.google.androidbrowserhelper:androidbrowserhelper:2.6.2' "$GRADLE"
          grep -q 'com.google.androidbrowserhelper:billing:1.2.0' "$GRADLE"
          grep -q 'com.android.vending.BILLING' "$MANIFEST"
          grep -q 'PaymentActivity' "$MANIFEST"
          grep -q 'PaymentService' "$MANIFEST"
          grep -q 'ManageDataLauncherActivity' "$MANIFEST"
          grep -q 'WebViewFallbackActivity' "$MANIFEST"
          grep -q 'DigitalGoodsRequestHandler' "$DELEGATION"
          if grep -q 'LAUNCHING_BROWSER' "$MANIFEST"; then
            echo 'Unexpected forced browser metadata found.' >&2
            exit 1
          fi

      - name: Build release-style test APK
        working-directory: android-test/orvuno-code7-test
        run: gradle --no-daemon :app:assembleRelease --stacktrace

      - name: Sign with isolated disposable TEST key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-output
          keytool -genkeypair -v \
            -keystore /tmp/orvuno-test.jks \
            -storepass 'orvuno-test-only-2026' \
            -keypass 'orvuno-test-only-2026' \
            -alias orvuno-test \
            -keyalg RSA -keysize 3072 -validity 365 \
            -dname 'CN=ORVUNO Temporary Test,O=Nadena Games,C=DE'
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -f -p 4 \
            android-test/orvuno-code7-test/app/build/outputs/apk/release/app-release-unsigned.apk \
            /tmp/orvuno-code7-test-aligned.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --ks /tmp/orvuno-test.jks \
            --ks-key-alias orvuno-test \
            --ks-pass pass:orvuno-test-only-2026 \
            --key-pass pass:orvuno-test-only-2026 \
            --out release-output/ORVUNO-1.0.4-code7-STARTTEST.apk \
            /tmp/orvuno-code7-test-aligned.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs \
            release-output/ORVUNO-1.0.4-code7-STARTTEST.apk \
            > release-output/ORVUNO-1.0.4-code7-STARTTEST-signature.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' release-output/ORVUNO-1.0.4-code7-STARTTEST-signature.txt

      - name: Create build report
        shell: bash
        run: |
          set -euo pipefail
          APK=release-output/ORVUNO-1.0.4-code7-STARTTEST.apk
          {
            echo 'ORVUNO Code7 side-by-side start test'
            echo 'package=de.nadena.orvuno.test'
            echo 'label=ORVUNO Test'
            echo 'versionName=1.0.4-test'
            echo 'versionCode=7'
            echo 'minSdk=23'
            echo 'targetSdk=36'
            echo 'coreABH=2.6.2 (same as original ORVUNO project)'
            echo 'billingABH=1.2.0 (PBL 8.3.0 bridge)'
            echo 'forcedBrowser=NO'
            echo 'testKey=temporary/disposable; production upload key not used or exposed'
            sha256sum "$APK"
            echo
            cat release-output/ORVUNO-1.0.4-code7-STARTTEST-signature.txt
          } > release-output/ORVUNO-1.0.4-code7-STARTTEST-report.txt
          test -s "$APK"
          test "$(stat -c%s "$APK")" -gt 10000

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: ORVUNO-1.0.4-code7-STARTTEST
          path: |
            release-output/ORVUNO-1.0.4-code7-STARTTEST.apk
            release-output/ORVUNO-1.0.4-code7-STARTTEST-report.txt
            release-output/ORVUNO-1.0.4-code7-STARTTEST-signature.txt
          if-no-files-found: error
          retention-days: 7

      - name: Generate Play project from startup-verified wrapper
        run: bash android-release/build-orvuno-code7-play.sh android-release/orvuno-code7-play

      - name: Validate exact Play identity
        run: |
          set -euo pipefail
          GRADLE=android-release/orvuno-code7-play/app/build.gradle
          MANIFEST=android-release/orvuno-code7-play/app/src/main/AndroidManifest.xml
          DELEGATION=android-release/orvuno-code7-play/app/src/main/java/de/nadena/orvuno/DelegationService.java
          grep -q "applicationId 'de.nadena.orvuno'" "$GRADLE"
          grep -q 'versionCode 7' "$GRADLE"
          grep -q "versionName '1.0.4'" "$GRADLE"
          grep -q 'com.google.androidbrowserhelper:androidbrowserhelper:2.6.2' "$GRADLE"
          grep -q 'com.google.androidbrowserhelper:billing:1.2.0' "$GRADLE"
          grep -q 'com.android.vending.BILLING' "$MANIFEST"
          grep -q 'PaymentActivity' "$MANIFEST"
          grep -q 'PaymentService' "$MANIFEST"
          grep -q 'DigitalGoodsRequestHandler' "$DELEGATION"
          if grep -q 'LAUNCHING_BROWSER' "$MANIFEST"; then
            echo 'Unexpected forced browser metadata found.' >&2
            exit 1
          fi

      - name: Build unsigned Play AAB
        working-directory: android-release/orvuno-code7-play
        run: gradle --no-daemon :app:bundleRelease --stacktrace

      - name: Collect Play AAB
        shell: bash
        run: |
          set -euo pipefail
          cp android-release/orvuno-code7-play/app/build/outputs/bundle/release/app-release.aab \
            release-output/ORVUNO-1.0.4-code7-unsigned.aab
          AAB=release-output/ORVUNO-1.0.4-code7-unsigned.aab
          test -s "$AAB"
          test "$(stat -c%s "$AAB")" -gt 10000
          {
            echo 'ORVUNO 1.0.4 / code 7 Play candidate'
            echo 'package=de.nadena.orvuno'
            echo 'versionName=1.0.4'
            echo 'versionCode=7'
            echo 'minSdk=23'
            echo 'targetSdk=36'
            echo 'coreABH=2.6.2 (startup-verified base)'
            echo 'billingABH=1.2.0'
            echo 'forcedBrowser=NO'
            echo 'signing=UNSIGNED in CI'
            sha256sum "$AAB"
          } > release-output/ORVUNO-1.0.4-code7-build-report.txt

      - name: Upload unsigned Play AAB
        uses: actions/upload-artifact@v4
        with:
          name: ORVUNO-1.0.4-code7-PLAY-UNSIGNED
          path: |
            release-output/ORVUNO-1.0.4-code7-unsigned.aab
            release-output/ORVUNO-1.0.4-code7-build-report.txt
          if-no-files-found: error
          retention-days: 7
