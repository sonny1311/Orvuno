name: ORVUNO native Google Play build

on:
  push:
    branches:
      - 'fix/orvuno-google-native-billing'
  pull_request:
    paths:
      - 'android/google/**'
      - 'js/core/GooglePlayNativeBillingIntegration.js'
      - 'js/core/StorePaymentProviderBootstrap.js'
      - 'js/core/PremiumPlanUIIntegration.js'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Build release APK and AAB
        working-directory: android/google
        run: gradle --no-daemon assembleRelease bundleRelease
      - name: Upload Google Play build
        uses: actions/upload-artifact@v4
        with:
          name: orvuno-google-native-release-unsigned
          path: |
            android/google/app/build/outputs/apk/release/*.apk
            android/google/app/build/outputs/bundle/release/*.aab
