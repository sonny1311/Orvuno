name: JavaScript syntax and repair checks

on:
  push:
    branches:
      - main
      - 'repair/**'
      - 'qa/**'
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find js api tests -type f \( -name '*.js' -o -name '*.mjs' \) -print0)
      - name: Check Edge Function TypeScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-strip-types --check supabase/functions/world-google-play/index.ts
          node --experimental-strip-types --check supabase/functions/world-game-id-auth/index.ts
      - name: Run Google Play repair regression tests
        shell: bash
        run: |
          node tests/google-play-repair.test.mjs
          node tests/google-play-user-activation.test.mjs
      - name: Run Amazon Appstore regression test
        shell: bash
        run: node tests/amazon-appstore-iap.test.mjs
      - name: Run player access regression test
        shell: bash
        run: node tests/player-access-no-game-id.test.mjs
      - name: Run pre-release content, auth and help regression tests
        shell: bash
        run: node tests/pre-release-qa-content.test.mjs

  amazon-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build unsigned ORVUNO Amazon release APK
        working-directory: android/amazon
        run: gradle --no-daemon assembleRelease
      - name: Upload unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: orvuno-amazon-release-unsigned
          path: android/amazon/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
