name: Export Android Sign Tools

on:
  push:
    branches: [feature/amazon-appstore-release]
    paths:
      - '.github/workflows/export-android-sign-tools.yml'
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Collect tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p sign-tools/lib
          cp "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign-tools/apksigner
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" sign-tools/lib/apksigner.jar
          cp "$ANDROID_HOME/build-tools/35.0.0/zipalign" sign-tools/zipalign
          chmod +x sign-tools/apksigner sign-tools/zipalign
      - uses: actions/upload-artifact@v4
        with:
          name: android-build-tools-35-signing
          path: sign-tools
          if-no-files-found: error
          retention-days: 1
