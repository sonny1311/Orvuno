name: Export Android Sign Tools

on:
  push:
    branches: [feature/amazon-appstore-release]
    paths:
      - '.github/workflows/export-android-sign-tools.yml'
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v4
        with:
          name: android-build-tools-35-signing
          path: |
            ${{ env.ANDROID_HOME }}/build-tools/35.0.0/apksigner
            ${{ env.ANDROID_HOME }}/build-tools/35.0.0/lib/apksigner.jar
            ${{ env.ANDROID_HOME }}/build-tools/35.0.0/zipalign
          if-no-files-found: error
          retention-days: 1
