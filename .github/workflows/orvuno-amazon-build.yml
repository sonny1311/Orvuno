name: ORVUNO Amazon APK build

on:
  push:
    branches:
      - fix/orvuno-amazon-wrapper
  pull_request:
    paths:
      - 'android/amazon/**'
      - '.github/workflows/orvuno-amazon-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build unsigned release APK
        working-directory: android/amazon
        run: gradle --no-daemon assembleRelease
      - name: Upload unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: orvuno-amazon-release-unsigned
          path: android/amazon/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
