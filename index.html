<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07101d">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="application-name" content="ORVUNO">

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="app-icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="app-icon.svg">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/app-shell.css">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5715415363963326" crossorigin="anonymous"></script>
  <style>
    /* Vor erfolgreicher Anmeldung darf keinerlei Spiel-UI durchscheinen oder anklickbar sein. */
    html:not(.orvuno-authenticated) #worldApp,
    html:not(.orvuno-authenticated) #world-main-nav,
    html:not(.orvuno-authenticated) .android-download-fab{display:none!important;pointer-events:none!important}
    .android-download-fab{position:fixed;right:18px;bottom:18px;z-index:99990;display:inline-flex;align-items:center;gap:9px;padding:12px 16px;border:1px solid #d7a62b;border-radius:999px;background:#142033;color:#fff;text-decoration:none;font:800 14px/1 system-ui,sans-serif;box-shadow:0 10px 30px rgba(0,0,0,.35)}
    .android-download-fab:hover{background:#1a2a42}
    @media (max-width:700px){.android-download-fab{right:12px;bottom:12px;padding:11px 14px;font-size:13px}}
  </style>
  <script>
    (()=>{
      let shown=false;
      function showBootError(message,source=''){
        if(window.orvunoBootComplete||shown)return;
        shown=true;
        const render=()=>{
          const i18n=window.orvunoI18n;
          const tx=(key,fallback)=>i18n?.t?.(key)||fallback;
          const box=document.createElement('div');box.id='orvuno-boot-error';
          Object.assign(box.style,{position:'fixed',inset:'0',zIndex:'999999',display:'flex',alignItems:'center',justifyContent:'center',padding:'24px',background:'radial-gradient(circle at 50% 20%,#17263d,#03070c 70%)',fontFamily:'Arial,sans-serif',color:'#fff'});
          const card=document.createElement('div');Object.assign(card.style,{width:'min(620px,94vw)',padding:'30px',borderRadius:'18px',background:'#101a2b',border:'1px solid #7f3340',boxShadow:'0 24px 80px rgba(0,0,0,.55)'});
          const title=document.createElement('h1');title.dataset.i18n='boot.title';title.textContent=tx('boot.title','ORVUNO konnte nicht gestartet werden');title.style.margin='0 0 14px';
          const text=document.createElement('div');text.dataset.i18n='boot.text';text.textContent=tx('boot.text','Beim Laden ist ein technischer Fehler aufgetreten. Der Spielstand wurde dadurch nicht verändert.');Object.assign(text.style,{lineHeight:'1.5',color:'#dce3ed',marginBottom:'18px'});
          const detail=document.createElement('pre');detail.textContent=[message,source].filter(Boolean).join('\n');Object.assign(detail.style,{whiteSpace:'pre-wrap',wordBreak:'break-word',padding:'13px',borderRadius:'9px',background:'#080d16',color:'#ffb4bd',fontSize:'12px'});
          const retry=document.createElement('button');retry.dataset.i18n='common.reload';retry.textContent=tx('common.reload','Neu laden');Object.assign(retry.style,{marginTop:'18px',padding:'12px 18px',border:0,borderRadius:'9px',background:'#3868ee',color:'#fff',fontWeight:'800',cursor:'pointer'});retry.onclick=()=>location.reload();
          card.append(title,text,detail,retry);box.append(card);document.body.append(box);
        };
        if(document.body)render();else addEventListener('DOMContentLoaded',render,{once:true});
      }
      addEventListener('error',e=>showBootError(e.message||'Unbekannter Startfehler',e.filename?`${e.filename}:${e.lineno||''}`:''));
      addEventListener('unhandledrejection',e=>{const r=e.reason;showBootError(r?.message||String(r||'Unbekannter Startfehler'));});
      window.orvunoShowBootError=showBootError;
    })();
  </script>
</head>
<body>
  <div id="worldApp"></div>
  <a class="android-download-fab" data-i18n="android.download" href="https://github.com/sonny1311/worldproject/releases/download/android-v1.0.0/app-release-signed.apk" download>📱 ORVUNO für Android herunterladen</a>
  <script type="module" src="js/core/OrvunoI18nIntegration.js"></script>

  <script type="module" src="js/core/GooglePlayPriceUiIntegration.js"></script>

</html>
