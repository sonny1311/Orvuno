<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Orvuno – Nadena Anmeldung</title><style>body{font-family:system-ui;background:#0c1320;color:#fff;min-height:100vh;display:grid;place-items:center;margin:0}.c{max-width:520px;padding:32px;text-align:center}a{color:#9fd3ff}</style></head><body><main class="c"><h1>Orvuno</h1><p id="s">Nadena-Games-Konto wird übernommen…</p><p><a href="/">Zum normalen Login</a></p></main><script>(async()=>{const s=document.getElementById('s');try{const q=new URLSearchParams(location.search),h=new URLSearchParams(location.hash.slice(1));const code=q.get('nadena_sso'),verifier=h.get('nadena_verifier');history.replaceState(null,'',location.pathname);if(!code||!verifier)throw new Error('Ungültiger Nadena-Link.');const r=await fetch('https://ojhaeccyulyrwoxgeurf.supabase.co/functions/v1/nadena-sso-exchange',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({code,code_verifier:verifier,game_slug:'orvuno'})});const d=await r.json();if(!r.ok||!d.session)throw new Error('Automatische Anmeldung fehlgeschlagen.');localStorage.setItem('worldproject_supabase_session',JSON.stringify(d.session));location.replace('/');}catch(e){s.textContent=e.message||'Automatische Anmeldung fehlgeschlagen. Bitte nutze den normalen Login.';}})();</script></body></html>
